# Release curl-cmd on a version tag: publish the source package as a GitHub
# release asset.  curl-cmd is pure BASIC (no native build) — it installs by
# cataloging BP/HTTPGET + BP/HTTPGETFILE — so a single portable source artifact
# is all it ships.  Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
name: release
on:
  push:
    tags:
      # ONE rolling dev tag per release line, moved to the HEAD of develop by
      # the nightly when there is something new.  It builds through THIS
      # workflow rather than a second copy of it, so a dev build is the same
      # artifacts by the same steps as a release -- the only way a dev build is
      # worth having.
      #
      # `<maj>.<min>.x-dev' MATCHES THE PATTERN ABOVE, so the dev tag needs no
      # entry of its own any more.  It used to: the tag was a bare `dev', which
      # both version readers took for a stable 0.0.0 (mvx#364).  The entry is
      # gone rather than kept harmlessly, because a trigger for a shape we have
      # just retired is how the shape comes back.
      - "[0-9]+.[0-9]+*"
  # A TAG PUSHED BY A WORKFLOW DOES NOT TRIGGER ONE.  GitHub will not let the
  # default GITHUB_TOKEN start another run -- it is how recursion is prevented
  # -- so the nightly's tag lands and nothing happens.  It dispatches this
  # workflow on the tag instead, which is the same build from the same ref.
  workflow_dispatch:

permissions:
  contents: write
jobs:
  # THE MANIFESTS MUST NAME THE TAG, and this runs before anything is built so a
  # mismatch fails the release instead of shipping in it.  TWO releases went out
  # without it: the published 1.2.0 artifact declares itself 1.0.0, and 1.1.0 did
  # the same, because build-pkg.sh copies PKG and mvpkg.json verbatim (line 25)
  # and nothing stamps the tag (#22).
  #
  # EVERY OTHER JOB DEPENDS ON THIS ONE, including `source`, whose staging lives
  # outside this repo: publish-source and build-pkg.sh both copy the in-tree
  # manifests, so checking those two files once covers every artifact.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The manifests agree with each other
        run: |
          set -eu
          want=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                   mvpkg.json | head -1)
          [ -n "$want" ] || { echo "::error::mvpkg.json has no version"; exit 1; }
          sh tests/manifest-version.sh "$want"

  source:
    needs: [manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/curl-cmd
          artifact: curl-cmd
          title: curl-cmd
          body: "curl-cmd — the OS-curl HTTP transport for UniData (HTTPGET/HTTPGETFILE); provides the virtual 'curl'. Pure BASIC; indexed by the package registry."

  # ---- the account artifact, one per system it runs on ------------------------
  # curl-cmd is BASIC and shell only, so the staged account is IDENTICAL for udt,
  # uv and jbase -- what differs is only the system name in the artifact key, and
  # the cataloging, which MVPKG does on the target.  Hence `any-any-le` and a
  # plain hosted runner: os/arch-locking a package with no native code would pin
  # it to whichever machine packaged it, and taking a licensed container to copy
  # six files would make every release depend on the one self-hosted runner.
  #
  # Without these the registry serves this package as `source` on every system,
  # which is what it did for all four ports until now.
  account:
    # AFTER source, and ONE AT A TIME.  Each upload creates the release if it is
    # not there yet, so three of them starting together raced and two lost:
    #   Validation Failed: {"resource":"Release","code":"already_exists",...}
    # `needs: source` means the release already exists when these run, and
    # max-parallel 1 stops them racing each other for the same finalize.  Three
    # jobs that copy six files each cost nothing serialised.
    needs: [source]
    strategy:
      max-parallel: 1
      matrix:
        system: [udt, uv, jbase]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # JUST THE STAMPER.  This job compiles nothing, so it needs no toolchain
      # -- stamp-manifests.py is standalone Python.  Taken from mvx's `main`,
      # its RELEASED line, which moves when a release merges and not before:
      # the right coupling for a script with no compiler dependency, and the
      # opposite of the default branch.
      - name: Check out the manifest stamper
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          ref: main
          path: .mvx-src
          sparse-checkout: .github/actions/publish-source
          sparse-checkout-cone-mode: false

      - name: Stage the ${{ matrix.system }} account
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          BASE="curl-cmd-$VER-${{ matrix.system }}-any-any-le"
          rm -rf dist && mkdir -p dist
          sh build-pkg.sh dist
          # THE TAG IS THE SOURCE OF TRUTH (mvx#363).  TWO releases shipped
          # declaring 1.0.0 -- 1.1.0 and 1.2.0, in every asset -- because
          # build-pkg.sh copies PKG and mvpkg.json verbatim (line 25) and
          # nothing wrote the tag into them (#22).  Those two artifacts are
          # still wrong and nothing reaches back; this stops the next one.
          #
          # STAMPED AFTER STAGING, on the staged copy rather than the tree: the
          # artifact is what has to be honest, and leaving the checkout alone
          # keeps this job independent of the order the matrix runs in.
          #
          # And ASSERTED, because a stamper that silently did nothing would
          # leave exactly the bug it is here to prevent.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            python3 .mvx-src/.github/actions/publish-source/stamp-manifests.py \
              dist/curl-cmd "$VER"
            test "$(sed -n 2p dist/curl-cmd/PKG)" = "$VER"
          else
            echo "not a tag (${GITHUB_REF_TYPE:-unset} $VER): manifests left as committed"
          fi
          tar czf "$BASE.tar.gz" -C dist curl-cmd
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish the ${{ matrix.system }} account asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- what kind of release is this? ----------------------------------------
  # LAST, because it is correcting the publish steps rather than joining them.
  # Both of them create the release as a side effect of uploading to it, and
  # neither is told what the release is: publish-source marks a pre-release with
  # `contains(ref_name, '-')`, which is FALSE for `dev`; udt-build hands
  # softprops only a tag_name, and its defaults are `prerelease: false` and
  # latest.  So whichever finishes last decides, and left alone a nightly dev
  # build would present itself as the newest stable one -- to the registry, and
  # to anyone installing this package by name.
  #
  # Both directions are set explicitly, for the same reason: leaving the stable
  # case alone means it keeps whatever that race happened to leave behind.
  mark:
    needs: [source, account]
    runs-on: ubuntu-latest
    steps:
      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # STABLE IS THE ONE THAT IS NOT A PRE-RELEASE.  dev, beta and rc all
          # are; a stable tag is anything with no suffix -- 2.1.0, not
          # 2.1.0-rc1 and not dev.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac
